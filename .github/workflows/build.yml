name: Build and test

permissions:
  contents: write

on:
  push:
    branches:
      - agent-build-core
      - 'incident-fix/**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q app tests
      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Commit generated lockfile on build branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent-build-core'
        working-directory: .
        shell: bash
        run: |
          if git status --porcelain -- frontend/package-lock.json | grep -q .; then
            git config user.name "kurukshetra-build"
            git config user.email "actions@users.noreply.github.com"
            git add frontend/package-lock.json
            git commit -m "build: lock frontend dependencies"
            git push origin HEAD:agent-build-core
          fi
      - name: Record resolved frontend versions
        run: npm ls --depth=0
      - name: Build frontend
        run: npm run build

  windows-clean-clone:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Environment preflight
        run: python scripts/preflight.py --strict --ci
      - name: Bootstrap clean checkout
        run: python scripts/bootstrap.py
      - name: Run acceptance suite
        run: backend\.venv\Scripts\python.exe scripts\acceptance.py
